name: Release

# Builds the Tauri app (src-tauri/) on every OS, then puts all packages on one GitHub release.
# Push a tag matching package.json's version (e.g. `git tag v1.0.8 && git push origin v1.0.8`),
# or run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<package.json version>)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, bundles: nsis }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: x64, bundles: "deb,rpm,appimage" }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, arch: arm64, bundles: "app,dmg" }
          # Cross-compiled on the Apple Silicon runner.
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, arch: x64, bundles: "app,dmg" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxtst-dev libxi-dev libgtk-layer-shell-dev patchelf

      - run: npm ci
      # The shared game logic (src/node/domain), which the Tauri app runs in QuickJS.
      - run: npm test

      # The controller watchers are packaged: compile them from source, never ship the prebuilt ones.
      - if: runner.os == 'Windows'
        run: node scripts/build-win-gamepad.cjs --strict
      - if: runner.os == 'macOS'
        run: node scripts/build-mac-gamepad.cjs --strict

      # beforeBuildCommand (scripts/tauri-prepare.cjs) builds the renderer and stages src-tauri/frontend.
      # The CLI comes from package-lock.json (--no-install: never fetch an unpinned one), since it
      # builds the binaries that get released.
      - run: npx --no-install tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Tauri names packages "Wuwa Tappo_1.0.8_x64-setup.exe" etc.; keep the old wuwa-tappo-<version>-<arch> names.
      - name: Collect packages
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          base="wuwa-tappo-${version}-${{ matrix.arch }}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir packages
          shopt -s nullglob
          for file in "$bundle"/nsis/*-setup.exe; do cp "$file" "packages/${base}-setup.exe"; done
          for file in "$bundle"/deb/*.deb; do cp "$file" "packages/${base}.deb"; done
          for file in "$bundle"/rpm/*.rpm; do cp "$file" "packages/${base}.rpm"; done
          for file in "$bundle"/appimage/*.AppImage; do cp "$file" "packages/${base}.AppImage"; done
          for file in "$bundle"/dmg/*.dmg; do cp "$file" "packages/${base}.dmg"; done
          for app in "$bundle"/macos/*.app; do ditto -c -k --keepParent "$app" "packages/${base}.zip"; done
          ls -lh packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wuwa-tappo-${{ matrix.name }}
          path: packages/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG:-$version}"
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          merge-multiple: true

      - name: Write checksums
        working-directory: packages
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wuwa Tappo ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/*
