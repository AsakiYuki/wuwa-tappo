name: Tauri prototype

# Builds the Tauri pet-window prototype (src-tauri/) on every OS so it can be tried where the
# Electron app's trickiest behavior lives: transparency and click-through on macOS and Linux.
on:
  workflow_dispatch:
  push:
    branches: [tauri-poc]
    paths: ["src-tauri/**", "scripts/tauri-prepare.cjs", ".github/workflows/tauri-poc.yml"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: "" }
          - { name: linux-x64, os: ubuntu-24.04, args: "" }
          - { name: macos-arm64, os: macos-latest, args: "--target aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxtst-dev libxi-dev libgtk-layer-shell-dev patchelf

      - run: npm ci
      # beforeBuildCommand (tauri-prepare.cjs) builds the renderer and stages src-tauri/frontend.
      - run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wuwa-tappo-tauri-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
