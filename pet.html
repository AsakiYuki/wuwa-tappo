<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"
		/>
		<title>Wuwa Tappo · Desktop Pet</title>
		<link rel="stylesheet" href="original-ui/index-BjTCKBy6.css" />
		<link rel="stylesheet" href="pet.css" />
	</head>
	<body class="locale-en">
		<main id="petRoot">
			<div id="petContent">
				<div id="stage" title="Drag Pet">
					<img id="head" draggable="false" /><img id="body" draggable="false" /><img id="accessory" draggable="false" />
					<div id="bubble" class="local-emotion-bubble-layer"></div>
				</div>
				<div id="petName" hidden></div>
				<div id="emoteBar" class="emotion-menu"></div>
				<section class="desk">
					<div class="keyboard-plane"><div class="keyboard" id="keyboard" aria-label="42-key keyboard"></div></div>
					<div class="pet-info"><div class="text" id="counter">0</div></div>
					<div class="pet-toolbar">
						<button id="openChest" title="Unlimited Chests"></button
						><button class="settings-btn" id="openStudio" title="Open Studio"></button>
					</div>
				</section>
				<span id="inputStatus" hidden></span>
			</div>
		</main>
		<script src="names.js"></script>
		<script src="emotions.js"></script>
		<script src="pet.js"></script>
	</body>
</html>
