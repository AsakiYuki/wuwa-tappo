[package]
name = "wuwa-tappo"
version = "0.1.0"
description = "Wuwa Tappo - Tauri prototype of the pet window"
edition = "2021"
publish = false

[lib]
name = "wuwa_tappo_lib"
# Desktop only: a cdylib (needed for mobile) exceeds MinGW's 65535-export limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
