[package]
name = "wuwa-tappo"
version = "0.1.0"
description = "Wuwa Tappo - Desktop Companion"
edition = "2021"
publish = false

[lib]
name = "wuwa_tappo_lib"
# Desktop only: a cdylib (needed for mobile) exceeds MinGW's 65535-export limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
dirs = "6"
tauri-plugin-dialog = "2"
# One running app: two would overwrite each other's save. A second launch shows the studio instead.
tauri-plugin-single-instance = "2"
# Runs the TypeScript game logic (src/backend).
rquickjs = { version = "0.9", features = ["parallel"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray: unlike libappindicator (Tauri's tray), it reports clicks on the icon.
ksni = { version = "0.3", features = ["blocking"] }
# Wayland: the pet is a layer-shell surface (anchored, always above, off the taskbar), since
# Wayland windows cannot place themselves or stay on top. Same gtk as Tauri's.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# Hover-fade on KDE Wayland: KWin sends the cursor position over D-Bus. Same zbus as ksni.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# glib 0.18.5 with the fix for RUSTSEC-2024-0429 (GHSA-wrw7-89jp-8q8g), which was only released in
# 0.20; Tauri's GTK 3 bindings need 0.18. Drop it once they move on. See vendor/glib/PATCHES.md.
[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
